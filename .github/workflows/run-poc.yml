name: Run PoC

on:
  push:
  workflow_dispatch:

jobs:
  run-poc:
    # macOS runner; the Swift toolchain is preinstalled on GitHub-hosted images.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build and run PoC
        run: swift run poc
